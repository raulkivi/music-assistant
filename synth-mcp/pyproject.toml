[project]
name = "synth-mcp"
version = "0.1.0"
description = "MCP server that synthesizes audio from MusicXML with selectable voice parts and tempo control"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "music21>=9.0.0",
    "pyfluidsynth>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
synth-mcp = "synth_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as slow integration tests that require real backends (run with '-m integration')",
]
