[project]
name = "render-mcp"
version = "0.1.0"
description = "MCP server that renders MusicXML to PDF or PNG"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "verovio>=3.0.0",
    "cairosvg>=2.7.0",
    "pypdf>=4.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
render-mcp = "render_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as slow integration tests that require real backends (run with '-m integration')",
]
