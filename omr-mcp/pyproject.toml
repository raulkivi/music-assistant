[project]
name = "omr-mcp"
version = "0.1.0"
description = "MCP server for Optical Music Recognition"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "oemer>=0.1.0",
    "Pillow>=10.0.0",
]

[project.scripts]
omr-mcp = "omr_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as slow integration tests that require real backends (run with '-m integration')",
]